<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 231" width="200" height="231">
  <defs>
    <clipPath id="hex-clip">
      <polygon points="100,5 190,52.5 190,178.5 100,226 10,178.5 10,52.5"/>
    </clipPath>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2d5a1b"/>
      <stop offset="100%" style="stop-color:#1a3a0e"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <polygon points="100,5 190,52.5 190,178.5 100,226 10,178.5 10,52.5"
           fill="url(#bg-grad)"/>

  <!-- Subtle hex grid -->
  <g clip-path="url(#hex-clip)" opacity="0.1" stroke="#a8d878" stroke-width="0.8" fill="none">
    <polygon points="100,28 128,44 128,76 100,92 72,76 72,44"/>
    <polygon points="52,66 80,82 80,114 52,130 24,114 24,82"/>
    <polygon points="148,66 176,82 176,114 148,130 120,114 120,82"/>
    <polygon points="100,108 128,124 128,156 100,172 72,156 72,124"/>
  </g>

  <!-- ── Sheep (side profile, facing left) ── -->

  <!-- Tail (right side of body) -->
  <circle cx="138" cy="126" r="9" fill="#f5f2ec"/>

  <!-- Wool body: cluster of overlapping circles -->
  <circle cx="105" cy="122" r="28" fill="#edeae0"/>
  <circle cx="84"  cy="114" r="21" fill="#f5f2ec"/>
  <circle cx="93"  cy="101" r="21" fill="#f5f2ec"/>
  <circle cx="112" cy="99"  r="21" fill="#f5f2ec"/>
  <circle cx="126" cy="111" r="19" fill="#f5f2ec"/>
  <circle cx="129" cy="127" r="15" fill="#edeae0"/>
  <circle cx="80"  cy="128" r="15" fill="#edeae0"/>

  <!-- Head (facing left) -->
  <ellipse cx="62" cy="131" rx="16" ry="13" fill="#cac2b8"/>
  <!-- Ear -->
  <ellipse cx="66" cy="119" rx="6"  ry="9"  fill="#cac2b8"/>
  <ellipse cx="66" cy="120" rx="4"  ry="6"  fill="#c49080"/>
  <!-- Eye -->
  <circle  cx="55" cy="128" r="2.8" fill="#1a1a1a"/>
  <circle  cx="54" cy="127" r="0.9" fill="white"/>
  <!-- Nostril -->
  <ellipse cx="50" cy="135" rx="3.5" ry="2.5" fill="#b0a89e"/>
  <circle  cx="49" cy="135" r="1"   fill="#8a807a"/>
  <circle  cx="51.5" cy="135" r="1" fill="#8a807a"/>

  <!-- Legs -->
  <rect x="84"  y="148" width="8" height="22" rx="4" fill="#cac2b8"/>
  <rect x="97"  y="149" width="8" height="22" rx="4" fill="#cac2b8"/>
  <rect x="110" y="149" width="8" height="22" rx="4" fill="#cac2b8"/>
  <rect x="121" y="148" width="8" height="22" rx="4" fill="#cac2b8"/>
  <!-- Hooves -->
  <rect x="84"  y="166" width="8" height="4" rx="2" fill="#5a5048"/>
  <rect x="97"  y="167" width="8" height="4" rx="2" fill="#5a5048"/>
  <rect x="110" y="167" width="8" height="4" rx="2" fill="#5a5048"/>
  <rect x="121" y="166" width="8" height="4" rx="2" fill="#5a5048"/>

  <!-- Top text -->
  <text x="100" y="40" font-family="Georgia, serif" font-size="18" font-weight="bold"
        fill="#d4f0a0" text-anchor="middle" letter-spacing="1.5">baaad</text>
  <text x="100" y="57" font-family="Georgia, serif" font-size="11"
        fill="#a8cc78" text-anchor="middle" letter-spacing="3">STRATEGY</text>

  <!-- Bottom text — moved well inside hex -->
  <text x="100" y="196" font-family="Georgia, serif" font-size="9"
        fill="#a8cc78" text-anchor="middle" letter-spacing="1">Catan Simulation</text>

  <!-- Hex border -->
  <polygon points="100,5 190,52.5 190,178.5 100,226 10,178.5 10,52.5"
           fill="none" stroke="#a8d878" stroke-width="4"/>
</svg>
